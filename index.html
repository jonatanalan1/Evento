<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;padding:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
</style>
</head>
<body>
<title>Onde Devo Estar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F2F4F8;
  --ink:#242730;
  --ink-dim:#6B7280;
  --line:#E5E8EF;
  --accent:#1C64C7;
  --accent-ink:#FFFFFF;
  --accent-2:#159A4C;
  --accent-2-ink:#FFFFFF;
  --pit:#7C5CBF;
  --pit-ink:#FFFFFF;
  --warn:#E13A2E;
  --future:#0E8E78;
  --future-ink:#FFFFFF;
  --explore:#B9821E;
  --explore-ink:#FFFFFF;
  --shadow: 0 1px 2px rgba(20,24,33,.06), 0 8px 20px -10px rgba(20,24,33,.16);
  --font-display:'Poppins', 'Arial', sans-serif;
  --font-body:'Poppins', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --pal-azul:#1C64C7;
  --pal-azul-claro:#2FA0E8;
  --pal-vermelho:#E13A2E;
  --pal-verde:#159A4C;
  --pal-laranja:#EC6F32;
  --pal-amarelo:#D9A400;
  --pal-roxo:#7C5CBF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161A22; --surface:#1F2430; --surface-2:#272D3C;
    --ink:#F1F3F8; --ink-dim:#9AA3B5; --line:#333B4D;
    --accent:#5C9CF0; --accent-ink:#0B1526;
    --accent-2:#3FCB84; --accent-2-ink:#052213;
    --pit:#B39CEE; --pit-ink:#221A3A; --warn:#F17A70;
    --future:#3FC1A6; --future-ink:#062A22;
    --explore:#E3AA4E; --explore-ink:#2A1B02;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.6);
    --pal-azul:#5C9CF0;
    --pal-azul-claro:#6FC5F7;
    --pal-vermelho:#F17A70;
    --pal-verde:#3FCB84;
    --pal-laranja:#FF9A5C;
    --pal-amarelo:#F0CB5C;
    --pal-roxo:#B39CEE;
  }
}
:root[data-theme="dark"]{
  --bg:#161A22; --surface:#1F2430; --surface-2:#272D3C;
  --ink:#F1F3F8; --ink-dim:#9AA3B5; --line:#333B4D;
  --accent:#5C9CF0; --accent-ink:#0B1526;
  --accent-2:#3FCB84; --accent-2-ink:#052213;
  --pit:#B39CEE; --pit-ink:#221A3A; --warn:#F17A70;
  --future:#3FC1A6; --future-ink:#062A22;
  --explore:#E3AA4E; --explore-ink:#2A1B02;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.6);
  --pal-azul:#5C9CF0;
  --pal-azul-claro:#6FC5F7;
  --pal-vermelho:#F17A70;
  --pal-verde:#3FCB84;
  --pal-laranja:#FF9A5C;
  --pal-amarelo:#F0CB5C;
  --pal-roxo:#B39CEE;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;padding-inline:16px;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
}
.wrap{max-width:640px;margin:0 auto;}
a{color:inherit;}
button{font-family:inherit;}

/* ---- header / branding ---- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);
  padding-top:14px;padding-bottom:10px;z-index:20;border-bottom:1px solid var(--line);
}
.event-tabs{display:flex;gap:6px;background:var(--surface-2);border-radius:11px;padding:3px;margin-bottom:10px;}
.event-tabs button{flex:1;border:0;background:transparent;color:var(--ink-dim);padding:8px 6px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.event-tabs button[data-evt="future"].active{background:var(--future);color:var(--future-ink);}
.event-tabs button[data-evt="explore"].active{background:var(--explore);color:var(--explore-ink);}

.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.clock-badge{
  flex:none;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink);
  background:var(--surface-2);padding:7px 11px;border-radius:9px;font-variant-numeric:tabular-nums;
}
.logo-img{flex:none;height:34px;width:auto;max-width:30%;object-fit:contain;}

.main-nav{display:flex;align-items:center;gap:10px;}
.nav-group{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px;}
.nav-group button{border:0;background:transparent;color:var(--ink-dim);padding:7px 12px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.nav-group button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.fav-count{display:inline-block;min-width:15px;padding:0 4px;margin-left:5px;border-radius:8px;background:var(--accent-2);color:var(--accent-2-ink);font-size:9px;font-weight:800;line-height:15px;text-align:center;font-family:var(--font-mono);}
.nav-spacer{flex:1;}
.volunteer-btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;}
.volunteer-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

main{padding-top:16px;}
section{display:none;}
section.active{display:block;}

.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:11px 13px;font-size:14px;margin-bottom:12px;}
.search:focus{outline:2px solid var(--accent);outline-offset:1px;}
.list-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:14px 2px 8px;font-weight:700;}
.list-label:first-child{margin-top:0;}
.team-row{
  display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:7px;cursor:pointer;
  text-align:left;color:var(--ink);box-shadow:var(--shadow);
}
.team-row .num{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);background:var(--surface-2);border-radius:7px;padding:3px 6px;flex:none;font-variant-numeric:tabular-nums;}
.team-row .name{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-row .now-pill{flex:none;font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-dim);letter-spacing:.02em;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-row .now-pill.live{background:var(--accent);color:var(--accent-ink);}
.star-btn{flex:none;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;padding:4px;color:var(--line);}
.star-btn.on{color:var(--accent-2);}
.empty-hint{color:var(--ink-dim);font-size:13px;padding:20px 6px;text-align:center;line-height:1.5;}

.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:18px;}
.station-btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);}
.station-btn .k{display:block;font-family:var(--font-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.station-btn .t{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-top:2px;}
.station-btn.kind-mesa{border-top:3px solid var(--accent);}
.station-btn.kind-sala{border-top:3px solid var(--accent-2);}
.station-btn.kind-pit{border-top:3px solid var(--pit);}

.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.back-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;flex:none;}
.detail-title{min-width:0;}
.detail-title .name{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.1;text-wrap:balance;}
.detail-title .id{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}
.detail-actions{flex:none;margin-left:auto;display:flex;align-items:center;gap:8px;}
.color-picker{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-4px 0 14px;}
.color-picker .pk-label{font-size:11px;color:var(--ink-dim);margin-right:2px;}
.pal-btn{width:23px;height:23px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--line) inset;}
.pal-btn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink);}
.pal-clear{width:23px;height:23px;border-radius:50%;border:1.5px dashed var(--line);background:var(--surface);cursor:pointer;color:var(--ink-dim);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.pal-clear.on{border-style:solid;border-color:var(--ink);color:var(--ink);}

.board{background:#211A12;border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);margin-bottom:16px;}
.board-row{display:flex;align-items:baseline;gap:12px;padding:9px 0;}
.board-row + .board-row{border-top:1px solid #3A2E1F;}
.board-row .tag{flex:none;width:64px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:#AC9C82;text-transform:uppercase;}
.board-row .info{flex:1;min-width:0;}
.board-row .title{font-family:var(--font-display);font-weight:700;font-size:17px;color:#FBF3E4;text-wrap:balance;}
.board-row .loc{font-size:12px;color:#AC9C82;margin-top:1px;}
.board-row .time{flex:none;font-family:var(--font-mono);font-size:15px;font-weight:600;color:#AC9C82;font-variant-numeric:tabular-nums;text-align:right;}
.board-row.now .time{color:#FFA95C;}
.board-row.now .title{color:#FFA95C;}
.board-clock{font-family:var(--font-mono);font-size:11px;color:#AC9C82;text-align:right;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}

.timeline{list-style:none;margin:0;padding:0;}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.tl-item:last-child{border-bottom:0;}
.tl-item .time{flex:none;width:52px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);padding-top:1px;font-variant-numeric:tabular-nums;}
.tl-item .dot-col{flex:none;width:10px;display:flex;justify-content:center;}
.tl-item .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:5px;}
.tl-item .body{flex:1;min-width:0;}
.tl-item .lbl{font-size:14px;font-weight:600;}
.tl-item.past{opacity:.42;}
.tl-item.now .dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
.tl-item.now .lbl{color:var(--accent);}
.chip{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px;}
.chip.mesa{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent);}
.chip.sala{background:color-mix(in srgb, var(--accent-2) 18%, transparent);color:var(--accent-2);}
.chip.pit{background:color-mix(in srgb, var(--pit) 18%, transparent);color:var(--pit);}
.tl-item .loc-plain{font-size:12px;color:var(--ink-dim);margin-top:1px;}

.queue-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.queue-item:last-child{border-bottom:0;}
.queue-item .time{flex:none;width:96px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.queue-item .team{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.queue-item .num{font-family:var(--font-mono);color:var(--ink-dim);font-weight:500;margin-right:6px;}
.queue-item.now{background:color-mix(in srgb, var(--accent) 10%, transparent);border-radius:9px;padding-inline:8px;margin-inline:-8px;}
.queue-item.now .team{color:var(--accent);}
.queue-item.past{opacity:.4;}
.queue-item.notas{opacity:.65;}
.queue-item.notas .team{font-style:italic;font-weight:500;font-size:12.5px;color:var(--ink-dim);}

.fav-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);}
.fav-card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.fav-card .evt{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:6px;}
.fav-card .evt.f-future{background:var(--future);color:var(--future-ink);}
.fav-card .evt.f-explore{background:var(--explore);color:var(--explore-ink);}
.fav-card .name{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fav-card .now-line{font-size:13px;color:var(--ink-dim);}
.fav-card .now-line b{color:var(--ink);font-weight:600;}

/* ---- announcer ---- */
.ann-toggle{display:flex;gap:8px;margin-bottom:14px;}
.ann-toggle button{
  flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-dim);
  padding:9px 8px;border-radius:11px;font-size:12.5px;font-weight:800;cursor:pointer;
}
.ann-toggle button[data-evt="future"].on{background:var(--future);border-color:var(--future);color:var(--future-ink);}
.ann-toggle button[data-evt="explore"].on{background:var(--explore);border-color:var(--explore);color:var(--explore-ink);}
.ann-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.ann-nav-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;flex:none;}
.ann-nav-btn:disabled{opacity:.35;cursor:default;}
.ann-nav-mid{flex:1;text-align:center;}
.ann-nav-now{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px;}
.ann-card{border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);background:#211A12;}
.ann-card .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#AC9C82;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ann-card.urgent{box-shadow:0 0 0 3px var(--accent), var(--shadow);}
.ann-card .eyebrow .badge{background:var(--accent);color:var(--accent-ink);font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.03em;}
.ann-card.idle{background:var(--surface);border:1px solid var(--line);}
.ann-card.idle .eyebrow{color:var(--ink-dim);}
.ann-card.idle .ann-time{color:var(--ink);}
.ann-card.idle .ann-group .gt{color:var(--ink);}
.ann-card.idle .ann-team-row{color:var(--ink-dim);}
.ann-card.idle .ann-team-row b{color:var(--ink);}
.ann-time{font-family:var(--font-mono);font-size:26px;font-weight:600;color:#FBF3E4;font-variant-numeric:tabular-nums;margin-bottom:10px;}
.ann-evt-block{border-left:3px solid var(--line);padding-left:11px;margin-bottom:14px;}
.ann-evt-block:last-child{margin-bottom:0;}
.ann-evt-block.f-future{border-color:var(--future);}
.ann-evt-block.f-explore{border-color:var(--explore);}
.ann-evt-block .evt-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.ann-evt-block.f-future .evt-tag{color:var(--future);}
.ann-evt-block.f-explore .evt-tag{color:var(--explore);}
.ann-group{margin-bottom:10px;}
.ann-group:last-child{margin-bottom:0;}
.ann-group .gt{font-family:var(--font-display);font-weight:700;font-size:15px;color:#FBF3E4;margin-bottom:4px;}
.ann-line{color:#D8CBB4;font-size:13px;line-height:1.5;}
.ann-line b{color:#FBF3E4;font-family:var(--font-mono);font-weight:600;}
.ann-team-row{color:#D8CBB4;font-size:13px;line-height:1.75;}
.ann-team-row b{color:#FBF3E4;font-family:var(--font-mono);font-weight:600;margin-right:5px;}
.ann-next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:16px;display:flex;gap:12px;align-items:baseline;box-shadow:var(--shadow);}
.ann-next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);flex:none;width:56px;}
.ann-next .txt{flex:1;font-size:13px;font-weight:600;}
.ann-next .t{font-family:var(--font-mono);color:var(--ink-dim);font-size:12px;flex:none;}
.agenda-item{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 13px;margin-bottom:6px;cursor:pointer;}
.agenda-item.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);}
.agenda-item .t{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.agenda-item .s{font-size:13px;font-weight:600;margin-top:2px;}
.mode-sub{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:16px;}
.mode-sub button{flex:1;border:0;background:transparent;color:var(--ink-dim);padding:8px 6px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;}
.mode-sub button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

.section-note{font-size:12px;color:var(--ink-dim);line-height:1.5;margin:16px 2px 4px;}
footer{text-align:center;color:var(--ink-dim);font-size:11px;padding:22px 0 6px;}

@media (max-width:380px){
  body{padding-inline:11px;}
  .logo-img{height:28px;max-width:26%;}
  .clock-badge{font-size:11.5px;padding:6px 8px;}
  .main-nav{flex-wrap:wrap;gap:6px;}
  .nav-group button{padding:6px 9px;font-size:11.5px;}
  .volunteer-btn{padding:7px 10px;font-size:11.5px;}
  .nav-spacer{flex-basis:100%;height:0;}
}
@media (max-width:340px){
  .event-tabs button{font-size:11.5px;padding:7px 4px;}
  .station-grid{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));}
}
</style>
<div class="wrap">
  <div class="topbar">
    <div class="event-tabs" id="eventTabs"></div>
    <div class="brand-row" id="brandRow"></div>
    <div class="main-nav" id="mainNav"></div>
  </div>
  <main>
    <section id="view-team" class="active">
      <input class="search" id="teamSearch" type="text" inputmode="search" placeholder="Buscar equipe por nome ou número" />
      <div id="teamList"></div>
    </section>
    <section id="view-team-detail"></section>
    <section id="view-favorites"><div id="favList"></div></section>
    <section id="view-volunteers">
      <div class="mode-sub" id="volSubNav"></div>
      <div id="volBody"></div>
    </section>
    <section id="view-station-detail"></section>
  </main>
  <footer>Operação Nacional &middot; horários sujeitos a ajuste no local</footer>

const EVENTS = ['future','explore'];
const EVT_LABEL_CLASS = {future:'f-future', explore:'f-explore'};

let state = { event:'future', mode:'team', teamId:null, station:null, volMode:'announcer', annCursor:null };
let annEvents = { future:true, explore:true };

function loadJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let favs = loadJSON('unearthed_favs_v2', {future:[], explore:[]});
function saveFavs(){ saveJSON('unearthed_favs_v2', favs); }
function isFav(evt,id){ return favs[evt].includes(id); }
function toggleFav(evt,id){
  const i = favs[evt].indexOf(id);
  if(i>=0) favs[evt].splice(i,1); else favs[evt].push(id);
  saveFavs(); render();
}
function favTotal(){ return favs.future.length + favs.explore.length; }

const PALETTE = [
  {key:'azul', label:'Azul'},
  {key:'azul_claro', label:'Azul claro'},
  {key:'vermelho', label:'Vermelho'},
  {key:'verde', label:'Verde'},
  {key:'laranja', label:'Laranja'},
  {key:'amarelo', label:'Amarelo'},
  {key:'roxo', label:'Roxo/lilás'},
];
function paletteVar(key){ return PALETTE.some(p=>p.key===key) ? `var(--pal-${key.replace('_','-')})` : null; }
function colorStyle(key){
  const v = paletteVar(key);
  if(!v) return '';
  return ` style="border-left-color:${v};background:color-mix(in srgb, ${v} 16%, var(--surface));"`;
}

let teamColors = loadJSON('unearthed_colors_v2', {future:{}, explore:{}});
function saveColors(){ saveJSON('unearthed_colors_v2', teamColors); }
function getColor(evt,id){ return (teamColors[evt]||{})[id] || null; }
function setColor(evt,id,key){ teamColors[evt]=teamColors[evt]||{}; teamColors[evt][id]=key; saveColors(); }
function clearColor(evt,id){ if(teamColors[evt]) delete teamColors[evt][id]; saveColors(); }

function nowStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function toMin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
function fmtDelta(mins){ if(mins<=0) return 'agora'; if(mins===1) return 'em 1 min'; return 'em '+mins+' min'; }

function findNowNext(blocks){
  const n = nowStr();
  let cur=null, nxt=null;
  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    if(b.start<=n && n<b.end){ cur=b; nxt=blocks[i+1]||null; break; }
    if(n<b.start){ nxt=b; break; }
  }
  return {cur,nxt};
}

/* ---------- topbar ---------- */
function renderTopbar(){
  const ev = document.getElementById('eventTabs');
  ev.innerHTML = EVENTS.map(e=>{
    const d = DATA[e];
    return `<button data-evt="${e}" class="${state.event===e?'active':''}">${d.label}</button>`;
  }).join('');
  ev.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.event=b.dataset.evt; state.mode='team'; state.teamId=null; state.station=null; render();
  });

  const d = DATA[state.event];
  const logos = LOGOS[state.event];
  document.getElementById('brandRow').innerHTML = `
    <img class="logo-img" src="${logos[0]}" alt="${d.sublabel}">
    <div class="clock-badge" id="clockTop"></div>
    <img class="logo-img" src="${logos[1]}" alt="FIRST LEGO League">
  `;

  const nav = document.getElementById('mainNav');
  const modes = [['team','Equipes'],['favorites','Favoritos']];
  nav.innerHTML = `
    <div class="nav-group">
      ${modes.map(([k,label])=>{
        const badge = k==='favorites' && favTotal()>0 ? `<span class="fav-count">${favTotal()}</span>` : '';
        const active = state.mode===k || (state.mode==='team-detail'&&k==='team');
        return `<button data-mode="${k}" class="${active?'active':''}">${label}${badge}</button>`;
      }).join('')}
    </div>
    <div class="nav-spacer"></div>
    <button class="volunteer-btn ${(state.mode==='volunteers'||state.mode==='station-detail')?'active':''}" id="volBtn">Voluntários</button>
  `;
  nav.querySelectorAll('.nav-group button').forEach(b=>b.onclick=()=>{
    state.mode=b.dataset.mode; state.teamId=null; state.station=null; render();
  });
  document.getElementById('volBtn').onclick=()=>{ state.mode='volunteers'; state.station=null; render(); };
}

/* ---------- team list ---------- */
function renderTeamList(){
  const q = (document.getElementById('teamSearch').value||'').trim().toLowerCase();
  const teams = DATA[state.event].teams;
  const filtered = teams.filter(t => !q || t.name.toLowerCase().includes(q) || t.id.includes(q));
  const favIds = favs[state.event];
  const favTeams = filtered.filter(t=>favIds.includes(t.id));
  const rest = filtered.filter(t=>!favIds.includes(t.id));

  function rowHtml(t){
    const {cur} = findNowNext(t.blocks);
    const pill = cur ? `<span class="now-pill live">${cur.loc||cur.title}</span>` : `<span class="now-pill">livre agora</span>`;
    const on = favIds.includes(t.id);
    const col = getColor(state.event, t.id);
    const style = colorStyle(col);
    return `<div class="team-row" data-id="${t.id}"${style}>
      <span class="num">${t.id}</span>
      <span class="name">${t.name}</span>
      ${pill}
      <button class="star-btn ${on?'on':''}" data-star="${t.id}" aria-label="Favoritar">${on?'★':'☆'}</button>
    </div>`;
  }
  let html = '';
  if(favTeams.length){
    html += `<div class="list-label">Favoritas</div>` + favTeams.map(rowHtml).join('');
    html += `<div class="list-label">Todas as equipes</div>`;
  }
  html += rest.length ? rest.map(rowHtml).join('') : (favTeams.length?'':`<div class="empty-hint">Nenhuma equipe encontrada</div>`);
  document.getElementById('teamList').innerHTML = html;
  document.querySelectorAll('#teamList .team-row').forEach(el=>{
    el.onclick=(ev)=>{ if(ev.target.closest('.star-btn')) return; state.mode='team-detail'; state.teamId=el.dataset.id; render(); };
  });
  document.querySelectorAll('#teamList .star-btn').forEach(el=>{
    el.onclick=(ev)=>{ ev.stopPropagation(); toggleFav(state.event, el.dataset.star); };
  });
}

/* ---------- board ---------- */
function boardHtml(cur, nxt){
  const rows = [];
  if(cur){
    rows.push(`<div class="board-row now"><div class="tag">agora</div><div class="info"><div class="title">${cur.title}</div>${cur.loc?`<div class="loc">${cur.loc}</div>`:''}</div><div class="time">${cur.start}&ndash;${cur.end}</div></div>`);
  } else {
    rows.push(`<div class="board-row now"><div class="tag">agora</div><div class="info"><div class="title">Sem compromisso</div></div><div class="time">&mdash;</div></div>`);
  }
  if(nxt){
    rows.push(`<div class="board-row"><div class="tag">a seguir</div><div class="info"><div class="title">${nxt.title}</div>${nxt.loc?`<div class="loc">${nxt.loc}</div>`:''}</div><div class="time">${nxt.start}&ndash;${nxt.end}</div></div>`);
  } else {
    rows.push(`<div class="board-row"><div class="tag">a seguir</div><div class="info"><div class="title">Fim da programação do dia</div></div><div class="time">&mdash;</div></div>`);
  }
  return `<div class="board">${rows.join('')}<div class="board-clock">agora são ${nowStr()}</div></div>`;
}

/* ---------- team detail ---------- */
function renderTeamDetail(){
  const team = DATA[state.event].teams.find(t=>t.id===state.teamId);
  const view = document.getElementById('view-team-detail');
  if(!team){ view.innerHTML=''; return; }
  const {cur,nxt} = findNowNext(team.blocks);
  const on = isFav(state.event, team.id);
  const col = getColor(state.event, team.id);
  const n = nowStr();
  const items = team.blocks.map(b=>{
    const isNow = b.start<=n && n<b.end;
    const isPast = b.end<=n;
    const chip = b.kind ? `<span class="chip ${b.kind}">${b.loc}</span>` : '';
    const plain = (!b.kind && b.loc) ? `<div class="loc-plain">${b.loc}</div>` : '';
    return `<li class="tl-item ${isNow?'now':''} ${isPast?'past':''}">
      <div class="time">${b.start}</div>
      <div class="dot-col"><div class="dot"></div></div>
      <div class="body"><div class="lbl">${b.title}${chip}</div>${plain}</div>
    </li>`;
  }).join('');
  view.innerHTML = `
    <div class="detail-head">
      <button class="back-btn" id="backTeam">&larr; equipes</button>
      <div class="detail-title"><div class="name">${team.name}</div><div class="id">Equipe ${team.id} &middot; ${DATA[state.event].label}</div></div>
      <div class="detail-actions">
        <button class="star-btn ${on?'on':''}" id="starDetail">${on?'★':'☆'}</button>
      </div>
    </div>
    <div class="color-picker">
      <span class="pk-label">Cor da equipe:</span>
      ${PALETTE.map(p=>`<button class="pal-btn ${col===p.key?'on':''}" data-pal="${p.key}" style="background:var(--pal-${p.key.replace('_','-')})" title="${p.label}" aria-label="${p.label}"></button>`).join('')}
      <button class="pal-clear ${!col?'on':''}" id="colorClear" title="Sem cor" aria-label="Sem cor">&times;</button>
    </div>
    ${boardHtml(cur,nxt)}
    <div class="list-label">Programação do dia</div>
    <ul class="timeline">${items}</ul>
  `;
  document.getElementById('backTeam').onclick=()=>{state.mode='team';state.teamId=null;render();};
  document.getElementById('starDetail').onclick=()=>toggleFav(state.event,team.id);
  view.querySelectorAll('.pal-btn').forEach(el=>{
    el.onclick=()=>{ setColor(state.event, team.id, el.dataset.pal); render(); };
  });
  document.getElementById('colorClear').onclick=()=>{ clearColor(state.event, team.id); render(); };
}

/* ---------- favorites ---------- */
function renderFavorites(){
  const view = document.getElementById('favList');
  let cards = [];
  EVENTS.forEach(evt=>{
    favs[evt].forEach(id=>{
      const t = DATA[evt].teams.find(x=>x.id===id);
      if(!t) return;
      const {cur,nxt} = findNowNext(t.blocks);
      const line = cur
        ? `Agora: <b>${cur.loc||cur.title}</b> (${cur.start}&ndash;${cur.end})`
        : (nxt ? `Próximo: <b>${nxt.loc||nxt.title}</b> às ${nxt.start}` : 'Sem mais compromissos hoje');
      const col = getColor(evt, id);
      const style = colorStyle(col);
      cards.push(`<div class="fav-card" data-evt="${evt}" data-id="${id}"${style}>
        <div class="top"><span class="evt ${EVT_LABEL_CLASS[evt]}">${DATA[evt].label}</span><span class="name">${t.id} &middot; ${t.name}</span></div>
        <div class="now-line">${line}</div>
      </div>`);
    });
  });
  if(!cards.length){
    view.innerHTML = `<div class="empty-hint">Você ainda não favoritou nenhuma equipe.<br>Toque na estrela ☆ ao lado de uma equipe para acompanhar aqui.</div>`;
    return;
  }
  view.innerHTML = cards.join('');
  view.querySelectorAll('.fav-card').forEach(el=>{
    el.onclick=()=>{ state.event=el.dataset.evt; state.mode='team-detail'; state.teamId=el.dataset.id; render(); };
  });
}

/* ---------- volunteers subnav ---------- */
function renderVolunteers(){
  const nav = document.getElementById('volSubNav');
  const subs = [['announcer','Visão do animador'],['stations','Por posto']];
  nav.innerHTML = subs.map(([k,l])=>`<button data-sub="${k}" class="${state.volMode===k?'active':''}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.volMode=b.dataset.sub; render(); });
  const body = document.getElementById('volBody');
  if(state.volMode==='announcer') renderAnnouncer(body);
  else renderStationGroups(body);
}

/* ---------- announcer (combined future+explore) ---------- */
function groupByTitle(calls){
  const map = new Map();
  calls.forEach(c=>{
    if(!map.has(c.title)) map.set(c.title, {title:c.title, end:c.end, all:false, members:[]});
    const g = map.get(c.title);
    if(c.all){ g.all = true; }
    else { c.teams.forEach(t=> g.members.push({id:t.id,name:t.name,loc:c.loc})); }
  });
  return Array.from(map.values());
}
function annGroupHtml(g){
  if(g.all) return `<div class="ann-group"><div class="gt">${g.title}</div><div class="ann-team-row">Todas as equipes</div></div>`;
  const rows = g.members.map(m=>`<div class="ann-team-row"><b>${m.id}</b>${m.name}${m.loc?' &middot; '+m.loc:''}</div>`).join('');
  return `<div class="ann-group"><div class="gt">${g.title}</div>${rows}</div>`;
}
function getTimesForEvent(evt){ return DATA[evt].master.map(g=>g.time); }
function callsAtTime(evt, time){
  const g = DATA[evt].master.find(x=>x.time===time);
  return g ? g.calls : null;
}
function renderAnnEventBlock(evt, time){
  const calls = callsAtTime(evt, time);
  if(!calls) return '';
  const groups = groupByTitle(calls);
  return `<div class="ann-evt-block ${EVT_LABEL_CLASS[evt]}"><div class="evt-tag">${DATA[evt].label}</div>${groups.map(annGroupHtml).join('')}</div>`;
}
function summarizeCallsAt(active, t){
  const parts = [];
  active.forEach(e=>{
    const calls = callsAtTime(e, t);
    if(calls){ groupByTitle(calls).forEach(g=> parts.push(g.title)); }
  });
  return parts;
}
function wireAnnToggle(body){
  body.querySelectorAll('.ann-toggle button').forEach(b=>{
    b.onclick=()=>{
      const e = b.dataset.evt;
      const activeCount = EVENTS.filter(x=>annEvents[x]).length;
      if(annEvents[e] && activeCount<=1) return; // keep at least one
      annEvents[e] = !annEvents[e];
      state.annCursor = null;
      render();
    };
  });
}
function renderAnnouncer(body){
  const toggle = EVENTS.map(e=>`<button data-evt="${e}" class="${annEvents[e]?'on':''}">${DATA[e].label}</button>`).join('');
  const active = EVENTS.filter(e=>annEvents[e]);
  const n = nowStr(); const nm = toMin(n);
  let allTimes = new Set();
  active.forEach(e=> getTimesForEvent(e).forEach(t=>allTimes.add(t)));
  const times = Array.from(allTimes).sort();

  let html = `<div class="ann-toggle">${toggle}</div>`;

  if(!times.length){
    html += `<div class="ann-card idle"><div class="eyebrow">Programação</div><div class="ann-line">Selecione ao menos um evento.</div></div>`;
    body.innerHTML = html;
    wireAnnToggle(body);
    return;
  }

  // "live" pointer: the call that actually needs attention right now
  let idx = times.findIndex(t => toMin(t) > nm);
  const noMoreAction = (idx === -1);
  if(noMoreAction) idx = times.length;
  const prevIdx = idx-1;
  const liveIdx = (idx < times.length) ? idx : Math.max(0, prevIdx);

  let cursorIdx = state.annCursor;
  if(cursorIdx===null || cursorIdx<0 || cursorIdx>=times.length) cursorIdx = liveIdx;
  const isLive = cursorIdx === liveIdx;

  const mainTime = times[cursorIdx];
  let mainLabel, urgent=false, dark=true;
  if(isLive){
    if(noMoreAction){
      mainLabel = 'ÚLTIMA CHAMADA DO DIA'; dark = false;
    } else {
      const callDelta = toMin(mainTime) - 5 - nm;
      if(callDelta<=0){ mainLabel = 'CHAMAR AGORA'; urgent = true; }
      else { mainLabel = 'Chamar ' + fmtDelta(callDelta); }
    }
  } else {
    mainLabel = cursorIdx < liveIdx ? 'JÁ CHAMADO' : 'CHAMADA FUTURA';
    dark = false;
  }
  const afterTime = (cursorIdx+1 < times.length) ? times[cursorIdx+1] : null;

  html += `<div class="ann-nav">
    <button class="ann-nav-btn" id="annPrev" ${cursorIdx<=0?'disabled':''} aria-label="Chamada anterior">&larr;</button>
    <div class="ann-nav-mid">${!isLive?'<button class="ann-nav-now" id="annNow">voltar para agora</button>':''}</div>
    <button class="ann-nav-btn" id="annNext" ${cursorIdx>=times.length-1?'disabled':''} aria-label="Próxima chamada">&rarr;</button>
  </div>`;

  html += `<div class="ann-card ${urgent?'urgent':''} ${dark?'':'idle'}">
    <div class="eyebrow"><span>${mainLabel}</span></div>
    <div class="ann-time">${mainTime}</div>
    ${active.map(e=>renderAnnEventBlock(e, mainTime)).join('')}
  </div>`;

  if(afterTime){
    const parts = summarizeCallsAt(active, afterTime);
    html += `<div class="ann-next"><div class="lbl">depois</div><div class="txt">${parts.join(' &middot; ')}</div><div class="t">${afterTime}</div></div>`;
  }
  html += `<div class="list-label">Agenda completa do dia</div>`;
  html += times.map((t,i)=>{
    const parts = summarizeCallsAt(active, t);
    return `<div class="agenda-item ${i===cursorIdx?'active':''}" data-idx="${i}"><div class="t">${t}</div><div class="s">${parts.join(', ')}</div></div>`;
  }).join('');
  body.innerHTML = html;
  wireAnnToggle(body);
  document.getElementById('annPrev').onclick=()=>{ state.annCursor = Math.max(0, cursorIdx-1); render(); };
  document.getElementById('annNext').onclick=()=>{ state.annCursor = Math.min(times.length-1, cursorIdx+1); render(); };
  const nowBtn = document.getElementById('annNow');
  if(nowBtn) nowBtn.onclick=()=>{ state.annCursor = null; render(); };
  body.querySelectorAll('.agenda-item').forEach(el=>{
    el.onclick=()=>{ state.annCursor = parseInt(el.dataset.idx,10); render(); };
  });
}

/* ---------- stations ---------- */
function stationKind(name){ if(name.startsWith('Mesa')) return 'mesa'; if(name.startsWith('Sala')) return 'sala'; return 'pit'; }
function stationSortKey(name){
  const m = name.match(/^(\w+) (\d+)\s*([AB])?$/);
  const order = {Mesa:0,Sala:1,Pit:2};
  return [order[m[1]], parseInt(m[2],10), m[3]||''];
}
function renderStationGroups(body){
  const stations = Object.keys(DATA[state.event].stations).sort((a,b)=>{
    const ka=stationSortKey(a), kb=stationSortKey(b);
    return ka[0]-kb[0] || ka[1]-kb[1] || (ka[2]>kb[2]?1:ka[2]<kb[2]?-1:0);
  });
  const groups = {mesa:[],sala:[],pit:[]};
  stations.forEach(s=>groups[stationKind(s)].push(s));
  const titles = {mesa:'Mesas de experimentação/disputa', sala:'Salas de avaliação', pit:'Pits de avaliação'};
  let html = '';
  ['mesa','sala','pit'].forEach(k=>{
    if(!groups[k].length) return;
    html += `<div class="list-label">${titles[k]}</div><div class="station-grid">`;
    html += groups[k].map(s=>{
      const parts = s.split(' ');
      const num = parts[1] + (parts[2]?(' '+parts[2]):'');
      return `<button class="station-btn kind-${k}" data-st="${s}"><span class="k">${num}</span><span class="t">${k}</span></button>`;
    }).join('');
    html += `</div>`;
  });
  body.innerHTML = html;
  body.querySelectorAll('.station-btn').forEach(el=>{
    el.onclick=()=>{ state.mode='station-detail'; state.station=el.dataset.st; render(); };
  });
}
function renderStationDetail(){
  const queue = DATA[state.event].stations[state.station] || [];
  const view = document.getElementById('view-station-detail');
  const n = nowStr();
  const rows = [];
  queue.forEach(q=>{
    rows.push({start:q.start,end:q.end,team_id:q.team_id,team_name:q.team_name,notas:false});
    if(q.notes_end){ rows.push({start:q.end,end:q.notes_end,team_id:q.team_id,team_name:q.team_name,notas:true}); }
  });
  let cur=null,nxt=null;
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    if(r.start<=n && n<r.end && !r.notas){ cur={start:r.start,end:r.end,title:'Equipe '+r.team_id,loc:r.team_name}; break; }
    if(n<r.start){ nxt={start:r.start,end:r.end,title:'Equipe '+r.team_id,loc:r.team_name}; break; }
  }
  const items = rows.map(r=>{
    const isNow = r.start<=n && n<r.end;
    const isPast = r.end<=n;
    if(r.notas){
      return `<div class="queue-item notas ${isPast?'past':''}"><div class="time">${r.start}&ndash;${r.end}</div><div class="team">anotações do avaliador</div></div>`;
    }
    return `<div class="queue-item ${isNow?'now':''} ${isPast?'past':''}"><div class="time">${r.start}&ndash;${r.end}</div><div class="team"><span class="num">${r.team_id}</span>${r.team_name}</div></div>`;
  }).join('');
  view.innerHTML = `
    <div class="detail-head">
      <button class="back-btn" id="backStation">&larr; voluntários</button>
      <div class="detail-title"><div class="name">${state.station}</div><div class="id">${DATA[state.event].label} &middot; fila do dia</div></div>
    </div>
    ${boardHtml(cur,nxt)}
    <div class="list-label">Fila completa</div>
    ${items || '<div class="empty-hint">Sem equipes previstas neste posto.</div>'}
  `;
  document.getElementById('backStation').onclick=()=>{state.mode='volunteers';state.station=null;render();};
}

/* ---------- master render ---------- */
function render(){
  renderTopbar();
  ['view-team','view-team-detail','view-favorites','view-volunteers','view-station-detail'].forEach(id=>{
    document.getElementById(id).classList.remove('active');
  });
  if(state.mode==='team'){ document.getElementById('view-team').classList.add('active'); renderTeamList(); }
  else if(state.mode==='team-detail'){ document.getElementById('view-team-detail').classList.add('active'); renderTeamDetail(); }
  else if(state.mode==='favorites'){ document.getElementById('view-favorites').classList.add('active'); renderFavorites(); }
  else if(state.mode==='volunteers'){ document.getElementById('view-volunteers').classList.add('active'); renderVolunteers(); }
  else if(state.mode==='station-detail'){ document.getElementById('view-station-detail').classList.add('active'); renderStationDetail(); }
  const clockEl = document.getElementById('clockTop');
  if(clockEl) clockEl.textContent = nowStr();
  queueResize();
}

document.getElementById('teamSearch').addEventListener('input', renderTeamList);

/* ---------- wix / iframe auto-resize ---------- */
/* Envia a altura (e largura) do conteúdo para a janela-pai via postMessage,
   sempre que o conteúdo muda de view. O elemento do Wix que recebe o embed
   precisa estar configurado para escutar esta mensagem e ajustar o iframe -
   isso depende da configuração do lado do Wix, não só deste código. */
function reportSize(){
  try{
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    var w = Math.ceil(document.documentElement.getBoundingClientRect().width);
    window.parent.postMessage({type:'unearthed-resize', height:h, width:w}, '*');
  }catch(e){}
}
var _resizeQueued=false;
function queueResize(){
  if(_resizeQueued) return;
  _resizeQueued=true;
  requestAnimationFrame(function(){ _resizeQueued=false; reportSize(); });
}
if(window.ResizeObserver){
  new ResizeObserver(queueResize).observe(document.documentElement);
}
window.addEventListener('load', queueResize);
window.addEventListener('resize', queueResize);

render();
setInterval(render, 20000);
</script>
